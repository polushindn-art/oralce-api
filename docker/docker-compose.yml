version: '3.8'

services:
  # ============================================
  # DOCKER REGISTRY (порт 5000)
  # ============================================
  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
      - ./config.yml:/etc/docker/registry/config.yml:ro
    restart: unless-stopped
    networks:
      - oracle-network

  # ============================================
  # ТЕСТОВОЕ ПРИЛОЖЕНИЕ (DEV) - порт 8081
  # ============================================
  app-dev:
    image: api.ars:5000/oracle-api:test
    container_name: oracle-app-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped
    networks:
      - oracle-network

  # ============================================
  # РАБОЧЕЕ ПРИЛОЖЕНИЕ (PROD) - порт 8080
  # ============================================
  app-prod:
    image: api.ars:5000/oracle-api:latest
    container_name: oracle-app-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: unless-stopped
    networks:
      - oracle-network
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  oracle-network:
    driver: bridge

volumes:
  registry-data: