spring.application.name=OracleAPI

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=250

jwt.secret=abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234
jwt.expiration=50400000
jwt.secure=false
jwt.cookieName=accessToken

logging.charset.console=UTF-8
logging.charset.file=UTF-8

spring.profiles.active=dev

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== GENERAL HIKARICP SETTINGS FOR ALL ENVIRONMENTS =====
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.oracle.jdbc.defaultConnectionValidation=LOCAL