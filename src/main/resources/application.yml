knife4j:
  enable: true
  setting:
    language: en
    enable-group: true
    enable-swagger-models: false
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
max:
  api:
    age-verification-url: https://ext-api2.max.ru/v2/business/pos/age-verification
    bot-api-url: https://platform-api2.max.ru
    connect-timeout: 5000
    read-timeout: 60000
sms:
  ru:
    api-id: ${SMS_RU_API_ID:57BF6FEA-09FE-0B41-DA0E-EB517C544A35}
    default-from: ${SMS_RU_FROM:StroyFaktor}
    test-mode: ${SMS_RU_TEST_MODE:false}
    connect-timeout: 30000
    read-timeout: 30000
    max-numbers-per-request: 100
asterisk:
  ami:
    host: asterisk.ars
    port: 5038
management:
  endpoints:
    web:
      exposure:
        include: "health,metrics,hikaricp"
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    groups-order: asc
    try-it-out-enabled: true
  show-actuator: false
  group-configs:
    - group: auth
      display-name: Авторизация
      paths-to-match:
        - /v1/auth/**
    - group: oracle-packages
      display-name: Пакеты Oracle
      paths-to-match:
        - /v1/pictures/**
        - /v1/public/**
        - /v1/email/**
    - group: mark
      display-name: Маркировка
      paths-to-match:
        - /v1/mark/**
    - group: document
      display-name: Документы
      paths-to-match:
        - /v*/orderhead/**
        - /v*/idhead/**
        - /v*/orderpay/**
        - /v*/naklhead/**
        - /v*/prcdoc/**
        - /v*/prcprice/**
        - /v*/tohead/**
