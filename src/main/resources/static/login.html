<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            padding: 40px 35px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .login-container h1 {
            text-align: center;
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        .login-container .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #1976D2;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            color: #f44336;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2196F3;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .login-container { padding: 25px 20px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1>🔐 Вход</h1>
    <p class="subtitle">Введите логин и пароль для доступа к документам</p>

    <form id="loginForm" onsubmit="login(event)">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" placeholder="Введите логин" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Войти</button>

        <div class="error-msg" id="errorMsg">❌ Неверный логин или пароль</div>
    </form>

    <a href="/" class="back-link">← На главную</a>
</div>

<script>
    // Функция проверки актуальности токена на клиенте
    function isTokenValid(token) {
        if (!token) return false;
        try {
            const payloadBase64 = token.split('.')[1];
            const base64 = payloadBase64.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
            const payload = JSON.parse(jsonPayload);
            const currentTime = Math.floor(Date.now() / 1000);
            return !(payload.exp && payload.exp < currentTime);
        } catch (e) {
            return false;
        }
    }

    // Если токен уже есть и он валиден — сразу редиректим на главную
    const existingToken = localStorage.getItem('accessToken');
    if (existingToken && isTokenValid(existingToken)) {
        const redirect = localStorage.getItem('redirectAfterLogin') || '/';
        localStorage.removeItem('redirectAfterLogin');
        window.location.href = redirect;
    } else {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('username');
    }

    function login(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!username || !password) {
            showError('Пожалуйста, заполните все поля');
            return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading-spinner"></span> Вход...';
        hideError();

        // Укажите точный путь вашего эндпоинта.
        // Если метод @PostMapping("/token") висит прямо в контроллере, то путь '/token'
        fetch('/v1/auth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        })
            .then(res => res.json())
            .then(data => {
                console.log('Ответ сервера:', data);

                // Проверяем флаг успеха (в вашем коде бэкенда это state или success)
                const isSuccess = data.success === true || data.state === true || (data.data && data.data.state === true);

                if (!isSuccess) {
                    showError(data.message || 'Ошибка авторизации');
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                    return;
                }

                // Достаем токен из структуры MyApiResponse -> data (ResultAuth)
                let token = null;
                let userName = username;

                if (data.data) {
                    if (data.data.token) token = data.data.token;
                    if (data.data.username) userName = data.data.username;
                } else if (data.token) {
                    token = data.token;
                }

                if (token) {
                    localStorage.setItem('accessToken', token);
                    localStorage.setItem('username', userName);

                    let redirect = localStorage.getItem('redirectAfterLogin') || '/';
                    localStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirect;
                } else {
                    showError('Не удалось получить токен из ответа сервера');
                    btn.disabled = false;
                    btn.textContent = 'Войти';
                }
            })
            .catch(err => {
                showError('Ошибка соединения: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Войти';
            });
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = '❌ ' + msg;
        el.classList.add('show');
    }

    function hideError() {
        document.getElementById('errorMsg').classList.remove('show');
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const activeEl = document.activeElement;
            if (activeEl && (activeEl.id === 'username' || activeEl.id === 'password')) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        }
    });
</script>
</body>
</html>
